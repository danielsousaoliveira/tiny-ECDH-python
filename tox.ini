[tox]
min_version = 4.0
env_list = py39, py310, py311, py312, quality

[testenv]
deps =
    pytest
    numpy>=1.24
commands = pytest {posargs}

[testenv:quality]
skip_install = true
deps =
    build
    ruff
    twine
commands =
    ruff check .
    ruff format --check .
    python -m build
    twine check dist/*
