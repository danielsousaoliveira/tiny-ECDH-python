[tox]
min_version = 4.0
env_list = py39, py310, py311, py312, numpy1, numpy2, quality

[testenv]
deps =
    pytest
    numpy>=1.24,<3
commands = pytest {posargs}

[testenv:numpy1]
base_python = py311
deps =
    pytest
    numpy>=1.24,<2
commands = pytest {posargs}

[testenv:numpy2]
base_python = py311
deps =
    pytest
    numpy>=2,<3
commands = pytest {posargs}

[testenv:quality]
skip_install = true
deps =
    build
    ruff
    twine
commands =
    ruff check .
    ruff format --check .
    python -m build
    twine check dist/*
