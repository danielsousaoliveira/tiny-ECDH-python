[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-ecdh-python"
dynamic = ["version"]
description = "Educational ECDH implementation (NIST B-163); not for production use"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
authors = [{name = "tiny-ECDH-python contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
]
keywords = ["ECDH", "elliptic curve", "education"]
[project.urls]
Homepage = "https://github.com/danielsousaoliveira/tiny-ECDH-python"
Repository = "https://github.com/danielsousaoliveira/tiny-ECDH-python"
"Upstream (tiny-ECDH-c)" = "https://github.com/kokke/tiny-ECDH-c"
"Security policy" = "https://github.com/danielsousaoliveira/tiny-ECDH-python/blob/main/SECURITY.md"

[tool.setuptools]
packages = ["tiny_ecdh"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "tiny_ecdh._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
